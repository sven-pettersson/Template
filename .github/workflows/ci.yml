name: CI

on:
  pull_request:
    branches: [test, staging, main]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r code/backend/requirements-dev.txt
      - run: pytest

  ai-review:
    # Feature branches must bring a /check-result review when code/ changes.
    if: github.base_ref == 'test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require ai/reviews/check-result-*.md for code changes
        run: |
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)
          echo "$changed"
          if echo "$changed" | grep -q '^code/'; then
            if ! echo "$changed" | grep -qE '^ai/reviews/check-result-.*\.md$'; then
              echo "::error::code/ har ändrats men ingen ai/reviews/check-result-*.md följer med. Kör /check-result."
              exit 1
            fi
          fi
